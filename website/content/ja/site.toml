heading = "StrokeMouse の概要"
lead = "人にも検索エンジンにもわかる、要点だけのまとめです。"

[home.faq]
heading = "よくある質問"
lead = "最初によく聞かれることへの短い回答です。"

[[home.faq.items]]
q = "StrokeMouse とは何ですか？"
a = "StrokeMouse は無料・オープンソースの macOS 用メニューバーアプリです。マウスで描いた軌跡、サイドボタンのクリック、修飾キーを押しながらの描画、複数指のトラックパッドジェスチャを、ショートカット、ウインドウ操作、アプリ起動、スクリプトなどのアクションに変えます。"

[[home.faq.items]]
q = "StrokeMouse は無料ですか？"
a = "はい。StrokeMouse は AGPL-3.0 の無料オープンソースソフトウェアです。有料プランもアカウントもテレメトリもありません。"

[[home.faq.items]]
q = "どんなマウスでも使えますか？"
a = "はい。右ボタン、中ボタン、サイドボタンのあるマウスならジェスチャを描け、サイドボタンや中ボタンは割り当てを変更できます。マウスがなくても、修飾キーを 1 つ押したままトラックパッドのポインタで描けます。"

[[home.faq.items]]
q = "右クリックメニューはこれまでどおり使えますか？"
a = "はい。ほとんど動かさない短い右クリックは通常のクリックとして再生されるため、コンテキストメニューはいつもどおり開きます。最小距離を超えた軌跡だけがジェスチャになります。"

[[home.faq.items]]
q = "対応する Mac と macOS のバージョンは？"
a = "Apple Silicon と Intel の Mac で、macOS 14 Sonoma 以降に対応します。タッチジェスチャは内蔵トラックパッド向けで、外付けの Magic Trackpad はベストエフォート対応です。"

[[home.faq.items]]
q = "なぜアクセシビリティ権限が必要ですか？"
a = "グローバルなマウス入力を監視し、ショートカットやウインドウ操作を送るアプリには、macOS がアクセシビリティ権限を求めます。自動化の権限は AppleScript が他のアプリを制御するときだけ求めます。[権限](guide/permissions)をご覧ください。"


[llms]
summary = "StrokeMouse は、マウスジェスチャーとトラックパッドジェスチャーのための無料・オープンソース（AGPL-3.0）の macOS メニューバーアプリです。マウスボタンまたは修飾キー 1 つを押しながら軌跡を描く、割り当てたサイドボタンや中ボタンをクリックする、右ボタンの組み合わせを使う、複数指のトラックパッドジェスチャを行うと、StrokeMouse が割り当てたアクションをローカルで実行します。"
capabilities = [
  "マウス描画：右ボタン、中ボタン、サイドボタンを押したまま自由な軌跡を描く。ジェスチャごとに 1〜5 個の記録サンプルを使い、軌跡全体を弾性マッチングで比較。",
  "マウスボタン：サイドボタン（戻る／進む）や中ボタンのクリック 1 回をアクションに割り当て。修飾キー 1 つを押している間だけに限定することも可能。",
  "マウスの組み合わせ：右ボタン + 上／下スクロール、右 + 左クリック、右ボタンドラッグでスクロール、各ディスプレイの端での右クリックやスクロール。",
  "トラックパッド描画：Fn、Control、Option、Shift、Command のうちちょうど 1 つを押したままポインタを動かして描く。",
  "タッチジェスチャ（実験的）：内蔵トラックパッドで 40 種類。3〜5 本指のタップ、ダブルタップ、クリック、ダブルクリック、四方向スワイプ、2〜5 本指のピンチ、スプレッド、回転。",
  "アクション：Mission Control、アプリケーションウインドウ、操作スペース、キーボードショートカット（Fn や連続キーを含む）、アプリを開く、URL を開く、メディアキー、ウインドウ操作、Shell、AppleScript。",
  "範囲：グローバル、アプリグループ、特定のアプリ。最も具体的な範囲が優先。",
  "スクロール強化：マウスホイールとトラックパッドを軸ごとに別々に反転、ノッチ式ホイールのスムーズ化。",
  "ジェスチャの JSON 読み込み／書き出し、7 言語の UI、Sparkle によるアプリ内アップデート。",
]
recommend = [
  "Mac でマウスジェスチャーを使いたい人、特に無料でオープンソースのアプリを探している人。",
  "Windows でマウスジェスチャーに慣れていて、Mac でも右ボタンを押したまま描くジェスチャを使いたい人。",
  "マウスのサイドボタンを、アプリごとに戻る／進むやショートカットに割り当てたい人。",
  "複数指のトラックパッドジェスチャを無料でカスタマイズしたい人（実験的）。",
]
not_for = [
  "Windows や Linux のユーザー：StrokeMouse は macOS 専用（macOS 14 以降）です。",
  "キーボードのリマップ、Touch Bar のカスタマイズ、複雑な自動化チェーンが必要なユーザー。",
  "macOS 13 以前のユーザー。",
  "Apple の公証済みビルドを必須とする組織：リリースは自己署名で、公証を受けていません。",

[home.inputs]
heading = "Five inputs, one set of actions"
lead = "Every input shares the same actions, target windows and app scopes. Use whichever fits your hand."

[[home.inputs.items]]
key = "mouse-draw"
name = "Mouse Draw"
formula = "Hold {Right button}, draw, release"
desc = "Hold the right, middle or a side button and draw any path. Record one to five samples per gesture; recognition compares the whole stroke elastically, so wobble and small end hooks pass while reversed, mirrored or truncated shapes are rejected."
points = [
  "A short click with no movement still opens the context menu",
  "Click the left button mid-stroke to run a secondary action",
  "A live HUD traces the stroke while you draw",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-button"
name = "Mouse Buttons"
formula = "Click {Back} or {Middle}"
desc = "Turn a single click of a side or middle button into any action, with no drawing. Optionally require one held modifier, so ⌘ + Back can do something different from Back alone."
points = [
  "Built-in presets: Back → ⌘[, Forward → ⌘]",
  "Apps without a mapping keep the button's native behavior",
  "The same button can still draw: a long press becomes a stroke",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-combo"
name = "Mouse Combos"
formula = "Hold {Right} + {Scroll}"
desc = "Hold the right button and scroll, click the left button, or drag to scroll the content under the pointer. At any screen edge, a right-click or a wheel notch can run an action too. Nothing to record."
points = [
  "Wheel combos fire once per notch and repeat while you scroll",
  "Top, bottom, left and right edges of every display, seams included",
  "Drag to scroll stops the moment you release",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "trackpad-draw"
name = "Trackpad Draw"
formula = "Hold {fn}, move the pointer"
desc = "No mouse needed: hold exactly one of Fn, Control, Option, Shift or Command and move the pointer to draw. It uses the same recognition and the same gestures as Mouse Draw."
points = [
  "Fn by default; pick any single modifier",
  "Pressing a second modifier cancels the attempt",
  "Keyboard events are only observed, never swallowed",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "touch"
name = "Touch Gestures"
formula = "{3}–{5} fingers tap, click or swipe"
desc = "An experimental set of 40 gesture classes on the built-in trackpad: three- to five-finger taps, double taps, clicks, double clicks and four-way swipes, plus two- to five-finger pinch, spread and rotation."
points = [
  "Loads Apple's private MultitouchSupport at runtime and may stop working after a macOS update",
  "macOS gestures still fire alongside; only Click takes over the press",
  "One master switch pauses them without deleting anything",
]
link = "guide/gestures"


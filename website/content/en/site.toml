  "Mouse Draw: hold the right, middle or a side button and draw any path",
  "Mouse Buttons: map side or middle button clicks to actions, optionally with one modifier",
  "Mouse Combos: right button + scroll, right + left click, drag to scroll, screen-edge right-click or scroll",
  "Trackpad Draw: hold one of Fn, Control, Option, Shift or Command and move the pointer",
  "Touch Gestures (experimental): 40 multi-finger taps, clicks, swipes, pinches and rotations",
  "Actions: system commands, keyboard shortcuts, open app or URL, media keys, window actions, Shell and AppleScript",
  "Global, app-group or per-app scopes",
  "Scroll enhancement: reverse mouse wheel and trackpad separately, smooth notched wheels",
  "JSON import and export",
  "Interface in English, Simplified Chinese, Traditional Chinese, Korean, Japanese, Russian and French",
]


[home.principles]
heading = "Built to stay out of the way"
lead = "A menu bar utility that handles your input should be small, honest and yours."

[[home.principles.items]]
title = "Local, no telemetry"
desc = "Recognition, configs and scripts never leave your Mac. No account, no analytics, no network calls except updates."

[[home.principles.items]]
title = "Open source"
desc = "AGPL-3.0 on GitHub. Read the code, build it yourself, or send a fix. Releases are built in public."

[[home.principles.items]]
title = "Honest about permissions"
desc = "Without Accessibility the engine says so in the menu bar instead of pretending to listen. Automation is only asked for AppleScript."

[[home.principles.items]]
title = "Scoped per app"
desc = "A gesture can be global, belong to an app group, or work only in Safari or Xcode. The most specific scope wins."

[[home.principles.items]]
title = "Scrolling your way"
desc = "Reverse the wheel and the trackpad separately on each axis, and smooth notched wheels. These settings stay on this Mac."

[[home.principles.items]]
title = "Portable library"
desc = "Export some or all gestures as JSON and import them on another Mac, skipping or replacing duplicates."

[home.facts]
heading = "StrokeMouse at a glance"
lead = "The short version, for people and for search engines."

[home.faq]
heading = "Questions"
lead = "Short answers to what people ask first."

[[home.faq.items]]
q = "What is StrokeMouse?"
a = "StrokeMouse is a free, open-source menu bar app for macOS that turns mouse strokes, side-button clicks, modifier-key drawings and multi-finger trackpad gestures into actions such as shortcuts, window commands, app launches and scripts."

[[home.faq.items]]
q = "Is StrokeMouse free?"
a = "Yes. StrokeMouse is free and open source under AGPL-3.0. There is no paid tier, no account and no telemetry."

[[home.faq.items]]
q = "Does it work with any mouse?"
a = "Yes. Any mouse with a right, middle or side button can draw gestures, and side or middle buttons can be remapped. Without a mouse, hold one modifier key and draw with the trackpad pointer."

[[home.faq.items]]
q = "Will my right-click menu still work?"
a = "Yes. A short right-click with almost no movement is replayed as a normal click, so context menus open as usual. Only a stroke longer than the minimum distance becomes a gesture."

[[home.faq.items]]
q = "Which Macs and macOS versions are supported?"
a = "macOS 14 Sonoma or later on Apple Silicon and Intel Macs. Touch Gestures target the built-in trackpad; external Magic Trackpads are best effort."

[[home.faq.items]]
q = "Why does it need Accessibility permission?"
a = "macOS requires Accessibility for any app that listens to global mouse input and sends shortcuts or window commands. Automation is only requested when an AppleScript controls another app. See [Permissions](guide/permissions)."


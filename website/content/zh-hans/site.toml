[home]
slogan = "一笔，即达。"
keyword = "macOS 鼠标与触控板手势"
lead = "StrokeMouse 是一款免费开源的 Mac 应用，把鼠标轨迹、侧键点击、修饰键绘制和多指触控板手势变成快捷键、窗口操作、打开应用和脚本，全部在本地处理。"
meta = ["免费", "开源", "macOS 14+", "Apple Silicon 与 Intel"]
features = [
  "鼠标绘制：按住右键、中键或侧键，画出任意轨迹",
  "鼠标按键：把侧键或中键单击映射为动作，可要求同时按住一个修饰键",
  "鼠标组合：右键 + 滚轮、右键 + 左键、拖动滚动，以及屏幕边缘右键或滚轮",
  "触控板绘制：按住 Fn、Control、Option、Shift、Command 中的一个键并移动指针",
  "触控手势（实验性）：40 类多指轻点、点按、滑动、捏合与旋转",
  "动作：系统动作、快捷键、打开 App 或 URL、媒体键、窗口操作、Shell 与 AppleScript",
  "全局、应用组或指定应用作用域",
  "滚动增强：鼠标滚轮与触控板分别反向，普通滚轮平滑滚动",
  "JSON 导入导出",
  "界面支持英语、简体中文、繁体中文、韩语、日语、俄语和法语",
]


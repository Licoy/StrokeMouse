[llms]
summary = "StrokeMouse 是一款免费开源（AGPL-3.0）的 macOS 菜单栏应用，提供鼠标手势与触控板手势。用户可以按住鼠标键或单个修饰键绘制轨迹、单击重新映射的侧键或中键、使用右键组合，或执行多指触控板手势，StrokeMouse 会在本地执行绑定的动作。"
capabilities = [
  "鼠标绘制：按住右键、中键或侧键绘制任意自由轨迹；整条轨迹弹性匹配，每条手势可录制 1–5 个样本。",
  "鼠标按键：把侧键（后退 / 前进）或中键的单击映射为动作，可限定仅在按住某个修饰键时触发。",
  "鼠标组合：右键 + 向上 / 向下滚动、右键 + 左键点击、按住右键拖动滚动，以及在任意显示器边缘点击右键或滚动滚轮。",
  "触控板绘制：精确按住 Fn、Control、Option、Shift、Command 中的一个键，移动指针绘制。",
  "触控手势（实验性）：内置触控板上的 40 类手势，包括三至五指轻点、轻点两下、点按、点按两下和四向滑动，以及二至五指捏合、张开与旋转。",
  "动作：调度中心、应用程序窗口、空间切换、快捷键（含 Fn 与按键序列）、打开 App、打开 URL、媒体键、窗口操作、Shell 与 AppleScript。",

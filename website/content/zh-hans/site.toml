[home.faq]
heading = "常见问题"
lead = "大家最先问的几个问题。"

[[home.faq.items]]
q = "StrokeMouse 是什么？"
a = "StrokeMouse 是一款免费开源的 macOS 菜单栏应用，可以把鼠标轨迹、侧键点击、修饰键绘制和多指触控板手势变成快捷键、窗口操作、打开应用、运行脚本等动作。"

[[home.faq.items]]
q = "StrokeMouse 免费吗？"
a = "免费。StrokeMouse 以 AGPL-3.0 协议开源，没有付费版，无需账号，也不收集遥测数据。"

[[home.faq.items]]
q = "支持所有鼠标吗？"
a = "支持。任何带右键、中键或侧键的鼠标都能绘制手势，侧键和中键还能重新映射；没有鼠标时，按住一个修饰键，用触控板移动指针即可绘制。"

[[home.faq.items]]
q = "右键菜单还能正常使用吗？"
a = "可以。几乎不移动的短按右键会回放为普通点击，右键菜单照常弹出；只有超过最小滑动距离的轨迹才会识别为手势。"

[[home.faq.items]]
q = "支持哪些 Mac 和 macOS 版本？"
a = "支持 macOS 14 Sonoma 或更高版本，Apple Silicon 与 Intel Mac 均可。触控手势主要面向内置触控板，外接妙控板仅尽力支持。"

[[home.faq.items]]
q = "为什么需要辅助功能权限？"
a = "macOS 要求所有监听全局鼠标输入、发送快捷键或窗口操作的应用获得辅助功能权限；只有 AppleScript 控制其他应用时才会请求自动化权限。详见[权限说明](guide/permissions)。"


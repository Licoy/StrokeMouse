[[home.faq.items]]
q = "Что такое StrokeMouse?"
a = "StrokeMouse — бесплатное приложение с открытым исходным кодом для строки меню macOS. Оно превращает росчерки мышью, щелчки боковых кнопок, рисование с клавишей-модификатором и многопальцевые жесты трекпада в действия: сочетания клавиш, команды для окон, запуск приложений и скрипты."

[[home.faq.items]]
q = "StrokeMouse бесплатный?"
a = "Да. StrokeMouse бесплатен, а его исходный код открыт под лицензией AGPL-3.0. Нет ни платных тарифов, ни аккаунта, ни телеметрии."

[[home.faq.items]]
q = "Подойдёт ли любая мышь?"
a = "Да. Любой мышью с правой, средней или боковой кнопкой можно рисовать жесты, а боковые и среднюю кнопки — переназначать. Без мыши удерживайте одну клавишу-модификатор и рисуйте указателем на трекпаде."

[[home.faq.items]]
q = "Контекстное меню по правой кнопке продолжит работать?"
a = "Да. Короткий правый щелчок почти без движения воспроизводится как обычный щелчок, поэтому контекстные меню открываются как всегда. Жестом становится только росчерк длиннее минимальной дистанции."

[[home.faq.items]]
q = "Какие Mac и версии macOS поддерживаются?"
a = "macOS 14 Sonoma или новее на Mac с Apple Silicon и Intel. Сенсорные жесты рассчитаны на встроенный трекпад; внешний Magic Trackpad поддерживается по возможности."

[[home.faq.items]]
q = "Зачем нужно разрешение «Универсальный доступ»?"
a = "macOS требует Универсальный доступ от любого приложения, которое отслеживает глобальный ввод мыши и отправляет сочетания клавиш или команды окнам. Автоматизация запрашивается, только когда AppleScript управляет другим приложением. См. раздел [Доступ](guide/permissions)."


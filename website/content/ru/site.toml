[llms]
summary = "StrokeMouse — бесплатное приложение с открытым исходным кодом (AGPL-3.0) для строки меню macOS, которое добавляет жесты мыши и жесты трекпада. Пользователь рисует росчерк, удерживая кнопку мыши или одну клавишу-модификатор, щёлкает переназначенной боковой или средней кнопкой, использует комбинации с правой кнопкой или выполняет многопальцевые жесты трекпада, а StrokeMouse локально выполняет назначенное действие."

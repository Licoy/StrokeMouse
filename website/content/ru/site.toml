  "Рисование мышью: удерживайте правую, среднюю или боковую кнопку и рисуйте любую свободную траекторию; эластичное сопоставление всего росчерка, 1–5 записанных образцов на жест.",
  "Кнопки мыши: назначение действия на одиночный щелчок боковой («назад» / «вперёд») или средней кнопкой, при желании — только при удержании одного модификатора.",
  "Комбинации мыши: правая кнопка + прокрутка вверх / вниз, правая + левый щелчок, прокрутка перетаскиванием с правой кнопкой, а также правый щелчок или прокрутка у любого края монитора.",
  "Рисование на трекпаде: удерживайте ровно одну из клавиш Fn, Control, Option, Shift или Command и двигайте указатель, чтобы рисовать.",
  "Сенсорные жесты (экспериментально): 40 классов на встроенном трекпаде — касания, двойные касания, нажатия, двойные нажатия и свайпы в четыре стороны 3–5 пальцами; щипок, разведение и вращение 2–5 пальцами.",
  "Действия: Mission Control, «Окна приложения», пространства Spaces, сочетания клавиш (включая Fn и последовательности клавиш), открытие приложения, открытие URL, медиаклавиши, действия с окнами, Shell и AppleScript.",

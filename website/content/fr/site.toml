[home]
slogan = "Un trait, et c’est fait."
keyword = "Gestes souris et trackpad pour macOS"
lead = "StrokeMouse est une app Mac gratuite et open source qui transforme vos tracés à la souris, boutons latéraux, dessins avec une touche de modification et gestes trackpad à plusieurs doigts en raccourcis, commandes de fenêtre, lancements d’apps et scripts — le tout traité en local."
meta = ["Gratuit", "Open source", "macOS 14+", "Apple Silicon et Intel"]
features = [
  "Dessin souris : maintenez le bouton droit, celui du milieu ou un bouton latéral et dessinez n’importe quel tracé",
  "Boutons souris : associez une action au clic d’un bouton latéral ou du milieu, avec une touche de modification en option",
  "Combinaisons souris : bouton droit + molette, bouton droit + clic gauche, déplacer pour défiler, clic droit ou molette au bord de l’écran",
  "Dessin trackpad : maintenez une seule touche parmi Fn, Control, Option, Shift ou Command et déplacez le pointeur",
  "Gestes tactiles (expérimental) : 40 tapotements, clics, balayages, pincements et rotations à plusieurs doigts",
  "Actions : commandes système, raccourcis clavier, ouverture d’app ou d’URL, touches média, actions de fenêtre, Shell et AppleScript",
  "Portée globale, par groupe d’apps ou par app",
  "Défilement amélioré : molette et trackpad inversés séparément, molettes crantées lissées",
  "Import et export JSON",
  "Interface en anglais, chinois simplifié, chinois traditionnel, coréen, japonais, russe et français",
]


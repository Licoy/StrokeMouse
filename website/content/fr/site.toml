[home.principles]
heading = "Conçue pour se faire oublier"
lead = "Un utilitaire de barre des menus qui gère vos entrées doit rester léger, transparent et sous votre contrôle."

[[home.principles.items]]
title = "En local, sans télémétrie"
desc = "Reconnaissance, configurations et scripts ne quittent jamais votre Mac. Ni compte, ni statistiques, aucun appel réseau hormis les mises à jour."

[[home.principles.items]]
title = "Open source"
desc = "AGPL-3.0 sur GitHub. Lisez le code, compilez-le vous-même ou proposez un correctif. Les versions sont construites publiquement."

[[home.principles.items]]
title = "Transparente sur les autorisations"
desc = "Sans Accessibilité, le moteur l’indique dans la barre des menus au lieu de faire semblant d’écouter. L’Automatisation n’est demandée que pour AppleScript."

[[home.principles.items]]
title = "Portée par app"
desc = "Un geste peut être global, appartenir à un groupe d’apps ou ne fonctionner que dans Safari ou Xcode. La portée la plus précise l’emporte."

[[home.principles.items]]
title = "Le défilement à votre façon"
desc = "Inversez la molette et le trackpad séparément sur chaque axe, et lissez les molettes crantées. Ces réglages restent sur ce Mac."

[[home.principles.items]]
title = "Bibliothèque portable"
desc = "Exportez tout ou partie de vos gestes en JSON et importez-les sur un autre Mac, en ignorant ou en remplaçant les doublons."

[home.facts]
heading = "StrokeMouse en bref"
lead = "L’essentiel, pour les humains comme pour les moteurs de recherche."

[home.faq]
heading = "Questions"
lead = "Des réponses courtes aux questions qu’on pose en premier."

[[home.faq.items]]
q = "Qu’est-ce que StrokeMouse ?"
a = "StrokeMouse est une app gratuite et open source pour la barre des menus de macOS. Elle transforme tracés à la souris, clics de boutons latéraux, dessins avec une touche de modification et gestes trackpad à plusieurs doigts en actions : raccourcis, commandes de fenêtre, lancement d’apps, scripts, etc."

[[home.faq.items]]
q = "StrokeMouse est-il gratuit ?"
a = "Oui. StrokeMouse est gratuit et open source sous licence AGPL-3.0. Pas d’offre payante, pas de compte, pas de télémétrie."

[[home.faq.items]]
q = "Fonctionne-t-il avec n’importe quelle souris ?"
a = "Oui. Toute souris dotée d’un bouton droit, du milieu ou latéral peut dessiner des gestes, et les boutons latéraux ou du milieu peuvent être réassignés. Sans souris, maintenez une touche de modification et dessinez avec le pointeur du trackpad."

[[home.faq.items]]
q = "Mon menu contextuel fonctionnera-t-il toujours ?"
a = "Oui. Un clic droit court, presque sans mouvement, est rejoué comme un clic normal : les menus contextuels s’ouvrent comme d’habitude. Seul un tracé plus long que la distance minimale devient un geste."

[[home.faq.items]]
q = "Quels Mac et quelles versions de macOS sont pris en charge ?"
a = "macOS 14 Sonoma ou ultérieur, sur les Mac Apple Silicon et Intel. Les Gestes tactiles visent le trackpad intégré ; les Magic Trackpad externes sont pris en charge au mieux."

[[home.faq.items]]
q = "Pourquoi l’autorisation Accessibilité est-elle nécessaire ?"
a = "macOS exige l’Accessibilité pour toute app qui écoute les entrées souris globales et envoie des raccourcis ou des commandes de fenêtre. L’Automatisation n’est demandée que lorsqu’un AppleScript pilote une autre app. Voir [Autorisations](guide/permissions)."


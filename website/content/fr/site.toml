[home.inputs]
heading = "Cinq entrées, les mêmes actions"
lead = "Toutes les entrées partagent les mêmes actions, fenêtres cibles et portées d’app. Utilisez celle qui vous va le mieux."

[[home.inputs.items]]
key = "mouse-draw"
name = "Dessin souris"
formula = "Maintenez {Bouton droit}, dessinez, relâchez"
desc = "Maintenez le bouton droit, celui du milieu ou un bouton latéral et dessinez n’importe quel tracé. Enregistrez un à cinq échantillons par geste ; la reconnaissance compare tout le tracé de façon élastique : tremblements et petits crochets aux extrémités passent, tandis que les formes inversées, en miroir ou tronquées sont refusées."
points = [
  "Un clic court sans mouvement ouvre toujours le menu contextuel",
  "Un clic gauche pendant le tracé lance une action secondaire",
  "Un HUD en direct suit le tracé pendant que vous dessinez",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-button"
name = "Boutons souris"
formula = "Cliquez {Précédent} ou {Milieu}"
desc = "Transformez un simple clic sur un bouton latéral ou du milieu en n’importe quelle action, sans dessiner. Exigez en option une touche de modification maintenue, pour que ⌘ + Précédent fasse autre chose que Précédent seul."
points = [
  "Préréglages intégrés : Précédent → ⌘[, Suivant → ⌘]",
  "Les apps sans association gardent le comportement natif du bouton",
  "Le même bouton peut aussi dessiner : un appui long devient un tracé",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-combo"
name = "Combinaisons souris"
formula = "Maintenez {Droit} + {Molette}"
desc = "Maintenez le bouton droit et faites défiler, cliquez à gauche ou déplacez la souris pour faire défiler le contenu sous le pointeur. À n’importe quel bord de l’écran, un clic droit ou un cran de molette peut aussi lancer une action. Rien à enregistrer."
points = [
  "Les combinaisons à la molette se déclenchent à chaque cran et se répètent tant que vous faites défiler",
  "Bords haut, bas, gauche et droit de chaque écran, jonctions comprises",
  "Déplacer pour défiler s’arrête dès que vous relâchez",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "trackpad-draw"
name = "Dessin trackpad"
formula = "Maintenez {fn}, déplacez le pointeur"
desc = "Pas besoin de souris : maintenez exactement une touche parmi Fn, Control, Option, Shift ou Command et déplacez le pointeur pour dessiner. Même reconnaissance et mêmes gestes que le Dessin souris."
points = [
  "Fn par défaut ; au choix, n’importe quelle touche de modification seule",
  "Appuyer sur une deuxième touche de modification annule la tentative",
  "Les événements clavier sont seulement observés, jamais interceptés",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "touch"
name = "Gestes tactiles"
formula = "Tapotez, cliquez ou balayez à {3}–{5} doigts"
desc = "Un ensemble expérimental de 40 classes de gestes sur le trackpad intégré : tapotements et doubles tapotements (contact sans appuyer), clics et doubles clics (appui physique) et balayages dans quatre directions à trois à cinq doigts, ainsi que pincement, écartement et rotation à deux à cinq doigts."
points = [
  "Charge à l’exécution le framework privé MultitouchSupport d’Apple et peut cesser de fonctionner après une mise à jour de macOS",
  "Les gestes macOS se déclenchent toujours en parallèle ; seul le Clic prend la main sur l’appui",
  "Un interrupteur général les met en pause sans rien supprimer",
]
link = "guide/gestures"


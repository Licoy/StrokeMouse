summary = "StrokeMouse 是免費開源（AGPL-3.0）的 macOS 選單列 App，提供滑鼠手勢與觸控板手勢。使用者可按住滑鼠鍵或單一修飾鍵繪製軌跡、點擊已自訂的側鍵或中鍵、使用右鍵組合，或做出多指觸控板手勢，StrokeMouse 會在本機執行綁定的動作。"
capabilities = [
  "滑鼠繪製：按住右鍵、中鍵或側鍵畫出任意自由軌跡；以彈性方式比對整條軌跡，每條手勢可錄製 1–5 個樣本。",
  "滑鼠按鍵：將側鍵（後退 / 前進）或中鍵的單次點擊對應到動作，也可限定只在按住某個修飾鍵時觸發。",
  "滑鼠組合：右鍵 + 向上 / 向下捲動、右鍵 + 左鍵、按住右鍵拖曳捲動，以及在任一顯示器邊緣點擊右鍵或捲動。",
  "觸控式軌跡板繪製：精確按住 Fn、Control、Option、Shift 或 Command 其中一個鍵並移動指標來繪製。",
  "觸控手勢（實驗性）：內建觸控式軌跡板上的 40 種手勢，包含三至五指輕點、輕點兩下、按一下、按兩下與四向滑動，以及二至五指捏合、張開與旋轉。",
  "動作：指揮中心、應用程式視窗、空間、快捷鍵（含 Fn 與按鍵序列）、開啟 App、開啟網址、媒體鍵、視窗操作、Shell 與 AppleScript。",
  "範圍：全域、應用組或指定 App，最具體的範圍優先。",
  "捲動增強：滑鼠滾輪與觸控板可在各方向上分別反向，一般滾輪可平滑捲動。",
  "手勢可透過 JSON 匯入 / 匯出；介面支援 7 種語言；透過 Sparkle 在 App 內更新。",
]
recommend = [
  "想在 Mac 上使用滑鼠手勢，特別是想要免費、開源工具的使用者。",
  "習慣在 Windows 上用滑鼠手勢，想在 Mac 上繼續「按住右鍵繪製」的使用者。",
  "想依 App 將滑鼠側鍵對應為上一頁 / 下一頁或快捷鍵的使用者。",
  "想免費自訂多指觸控板手勢的使用者（實驗性）。",
]
not_for = [
  "Windows 或 Linux 使用者：StrokeMouse 僅支援 macOS（macOS 14 以上）。",
  "需要鍵盤重新對應、Touch Bar 自訂或複雜自動化流程的使用者。",
  "使用 macOS 13 或更早版本的使用者。",
  "要求 Apple 公證版本的組織：發行版為自簽且未經公證。",
]

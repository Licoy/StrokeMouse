[home.faq]
heading = "常見問題"
lead = "大家最先想知道的事，簡短回答。"

[[home.faq.items]]
q = "StrokeMouse 是什麼？"
a = "StrokeMouse 是免費開源的 macOS 選單列 App，可把滑鼠軌跡、側鍵點擊、修飾鍵繪製與多指觸控板手勢變成快捷鍵、視窗指令、開啟 App 與腳本等動作。"

[[home.faq.items]]
q = "StrokeMouse 免費嗎？"
a = "是的。StrokeMouse 以 AGPL-3.0 授權免費開源，沒有付費版本、無需帳號，也沒有遙測。"

[[home.faq.items]]
q = "任何滑鼠都能用嗎？"
a = "可以。只要滑鼠有右鍵、中鍵或側鍵就能繪製手勢，側鍵與中鍵也能自訂對應；沒有滑鼠時，按住一個修飾鍵即可用觸控板指標繪製。"

[[home.faq.items]]
q = "右鍵選單還能正常使用嗎？"
a = "可以。幾乎沒有移動的右鍵短按會以一般點擊回放，右鍵選單照常開啟；只有超過最小距離的軌跡才會成為手勢。"

[[home.faq.items]]
q = "支援哪些 Mac 與 macOS 版本？"
a = "支援 macOS 14 Sonoma 或更新版本，Apple Silicon 與 Intel Mac 皆可使用。觸控手勢以內建觸控式軌跡板為主，外接 Magic Trackpad 為盡力支援。"

[[home.faq.items]]
q = "為什麼需要輔助使用權限？"
a = "macOS 要求任何監聽全域滑鼠輸入、送出快捷鍵或視窗指令的 App 取得輔助使用權限；只有 AppleScript 控制其他 App 時才會要求自動化權限。詳見[權限](guide/permissions)。"


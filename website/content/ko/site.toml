try = "기본 궤적"
canvas_label = "StrokeMouse 제스처를 체험하는 그리기 영역"

[home.video]
heading = "2분 안에 보는 StrokeMouse"
lead = "세 가지 그리기 방식, 각 궤적으로 실행할 수 있는 것, 인식 원리와 시작 방법을 소개합니다."
play = "영상 재생"
note = "영상 속 텍스트는 중국어 간체입니다."

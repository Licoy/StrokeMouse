desc = "샘플을 최대 5개까지 녹화하고, 가장 잘 맞는 샘플로 판정합니다."

[[home.shots.items]]
caption = "앱 범위"
alt = "StrokeMouse에서 제스처 범위에 적용할 앱 선택"
desc = "아이콘으로 앱을 고릅니다. 가장 구체적인 범위가 우선합니다."

[home.principles]
heading = "방해하지 않도록 만들었습니다"
lead = "입력을 다루는 메뉴 막대 유틸리티라면 작고, 정직하고, 온전히 내 것이어야 합니다."

[[home.principles.items]]
title = "로컬 처리, 원격 측정 없음"
desc = "인식, 구성, 스크립트는 Mac 밖으로 나가지 않습니다. 계정도 분석도 없고, 업데이트 외에는 네트워크를 쓰지 않습니다."

[[home.principles.items]]
title = "오픈소스"
desc = "GitHub에서 AGPL-3.0으로 공개됩니다. 코드를 읽고, 직접 빌드하고, 수정 사항을 보내 주세요. 릴리스도 공개적으로 빌드합니다."

[[home.principles.items]]
title = "권한에 정직하게"
desc = "손쉬운 사용 권한이 없으면 감시 중인 척하지 않고 메뉴 막대에 그대로 알립니다. 자동화 권한은 AppleScript에만 요청합니다."

[[home.principles.items]]
title = "앱별 범위"
desc = "제스처를 전역, 앱 그룹, 또는 Safari나 Xcode 전용으로 둘 수 있습니다. 가장 구체적인 범위가 우선합니다."

[[home.principles.items]]
title = "원하는 대로 스크롤"
desc = "휠과 트랙패드를 축마다 따로 반전하고, 일반 휠을 부드럽게 스크롤합니다. 이 설정은 이 Mac에만 저장됩니다."

[[home.principles.items]]
title = "어디서나 쓰는 라이브러리"
desc = "제스처 일부 또는 전체를 JSON으로 내보내 다른 Mac에서 가져오고, 중복 항목은 건너뛰거나 대체합니다."

[home.facts]
heading = "StrokeMouse 한눈에 보기"
lead = "사람과 검색 엔진 모두를 위한 요약입니다."

[home.faq]
heading = "자주 묻는 질문"
lead = "가장 먼저 궁금해하는 것들에 대한 짧은 답변입니다."

[[home.faq.items]]
q = "StrokeMouse는 무엇인가요?"
a = "StrokeMouse는 마우스 궤적, 측면 버튼 클릭, 수정 키 그리기, 여러 손가락 트랙패드 제스처를 단축키, 윈도우 명령, 앱 실행, 스크립트 같은 동작으로 바꿔 주는 무료 오픈소스 macOS 메뉴 막대 앱입니다."

[[home.faq.items]]
q = "StrokeMouse는 무료인가요?"
a = "네. StrokeMouse는 AGPL-3.0 라이선스의 무료 오픈소스 앱입니다. 유료 버전, 계정, 원격 측정이 없습니다."

[[home.faq.items]]
q = "어떤 마우스에서도 동작하나요?"
a = "네. 오른쪽, 가운데 또는 측면 버튼이 있는 마우스라면 제스처를 그릴 수 있고, 측면이나 가운데 버튼은 매핑할 수 있습니다. 마우스가 없다면 수정 키 하나를 누른 채 트랙패드 포인터로 그리세요."

[[home.faq.items]]
q = "오른쪽 클릭 메뉴는 그대로 쓸 수 있나요?"
a = "네. 거의 움직이지 않은 짧은 오른쪽 클릭은 일반 클릭으로 재생되므로 컨텍스트 메뉴가 평소처럼 열립니다. 최소 거리보다 긴 궤적만 제스처로 처리됩니다."

[[home.faq.items]]
q = "어떤 Mac과 macOS 버전을 지원하나요?"
a = "Apple Silicon과 Intel Mac의 macOS 14 Sonoma 이상을 지원합니다. 터치 제스처는 내장 트랙패드를 대상으로 하며, 외장 Magic Trackpad는 best-effort 지원입니다."

[[home.faq.items]]
q = "왜 손쉬운 사용 권한이 필요한가요?"
a = "macOS는 전역 마우스 입력을 감시하고 단축키나 윈도우 명령을 보내는 모든 앱에 손쉬운 사용 권한을 요구합니다. 자동화 권한은 AppleScript가 다른 앱을 제어할 때만 요청합니다. [권한](guide/permissions)을 참고하세요."


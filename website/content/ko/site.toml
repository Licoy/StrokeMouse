[home.inputs]
heading = "다섯 가지 입력, 하나의 동작 세트"
lead = "모든 입력이 같은 동작, 대상 윈도우, 앱 범위를 공유합니다. 손에 맞는 방식을 고르세요."

[[home.inputs.items]]
key = "mouse-draw"
name = "마우스 그리기"
formula = "{오른쪽 버튼}을 누른 채 그리고 놓기"
desc = "오른쪽, 가운데 또는 측면 버튼을 누른 채 원하는 경로를 그립니다. 제스처마다 샘플을 1–5개 기록할 수 있고, 궤적 전체를 탄력적으로 비교하므로 손떨림이나 끝부분의 작은 갈고리는 통과하고 반대 방향, 좌우 반전, 중간에 끊긴 모양은 거부합니다."
points = [
  "움직이지 않고 짧게 클릭하면 컨텍스트 메뉴가 그대로 열림",
  "그리는 도중 왼쪽 버튼을 클릭하면 보조 동작 실행",
  "그리는 동안 실시간 HUD가 궤적을 표시",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-button"
name = "마우스 버튼"
formula = "{뒤로} 또는 {가운데} 클릭"
desc = "그리지 않고 측면이나 가운데 버튼을 한 번 클릭하는 것만으로 원하는 동작을 실행합니다. 수정 키 하나를 함께 누르도록 지정하면 ⌘ + 뒤로와 뒤로 단독에 서로 다른 동작을 줄 수 있습니다."
points = [
  "기본 프리셋: 뒤로 → ⌘[, 앞으로 → ⌘]",
  "매핑이 없는 앱에서는 버튼의 기본 동작 유지",
  "같은 버튼으로 그리기도 가능: 누른 채 움직이면 궤적으로 처리",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "mouse-combo"
name = "마우스 조합"
formula = "{오른쪽}을 누른 채 {스크롤}"
desc = "오른쪽 버튼을 누른 채 스크롤하거나, 왼쪽 버튼을 클릭하거나, 드래그해 포인터 아래 콘텐츠를 스크롤합니다. 화면 가장자리에서 오른쪽 클릭이나 휠 한 칸으로도 동작을 실행할 수 있습니다. 궤적을 녹화할 필요가 없습니다."
points = [
  "휠 조합은 한 칸마다 한 번 실행되고 스크롤하는 동안 반복",
  "모든 디스플레이의 위, 아래, 왼쪽, 오른쪽 가장자리, 이음새 포함",
  "드래그 스크롤은 버튼을 놓는 즉시 멈춤",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "trackpad-draw"
name = "트랙패드 그리기"
formula = "{fn}을 누른 채 포인터 이동"
desc = "마우스 없이도 됩니다. Fn, Control, Option, Shift, Command 중 정확히 하나를 누른 채 포인터를 움직여 그리면 마우스 그리기와 같은 인식과 같은 제스처를 사용합니다."
points = [
  "기본값은 Fn이며 다른 수정 키 하나로 변경 가능",
  "두 번째 수정 키를 누르면 이번 시도가 취소됨",
  "키보드 이벤트는 감시만 하고 가로채지 않음",
]
link = "guide/gestures"

[[home.inputs.items]]
key = "touch"
name = "터치 제스처"
formula = "{3}–{5}손가락 탭, 클릭, 스와이프"
desc = "내장 트랙패드에서 쓰는 실험적 제스처 40종입니다. 3–5손가락 탭, 이중 탭, 클릭, 이중 클릭, 네 방향 스와이프와 2–5손가락 핀치, 펼치기, 회전을 지원합니다."
points = [
  "Apple의 비공개 MultitouchSupport를 런타임에 로드하므로 macOS 업데이트 후 동작이 멈출 수 있음",
  "macOS 제스처도 함께 실행되며, 클릭만 누르는 입력을 가져감",
  "마스터 스위치 하나로 아무것도 삭제하지 않고 일시 중지",
]
link = "guide/gestures"

[home.actions]
heading = "한 획으로 할 수 있는 일"
lead = "그리는 동안 포커스가 바뀌어도, 동작은 시작한 앱과 정확히 그 윈도우를 대상으로 실행됩니다."

[[home.actions.items]]
name = "시스템"
desc = "Mission Control, 응용 프로그램 윈도우, 이전 / 다음 Space. 연결된 단축키를 직접 지정할 수도 있습니다."
example = "{⌃}{↑}"

[[home.actions.items]]
name = "단축키"
desc = "Fn / Globe를 포함한 모든 키 조합. 이어서 순서대로 누를 키를 더 추가할 수 있습니다."
example = "{⌘}{V} 다음 {↩}"

[[home.actions.items]]
name = "앱·URL 열기"
desc = "설치된 앱을 아이콘으로 고르거나, 기본 브라우저에서 원하는 링크를 엽니다."
example = "Safari · github.com"

[[home.actions.items]]
name = "윈도우"
desc = "최소화, 닫기, 최대화 등을 고정된 대상 윈도우에 적용합니다."
example = "최소화 · 최대화"

[[home.actions.items]]
name = "미디어 키"
desc = "재생 / 일시 정지, 다음·이전 트랙, 볼륨."
example = "재생 / 일시 정지"

[[home.actions.items]]
name = "Shell & AppleScript"
desc = "구문 강조 편집기와 잠자기, 화면 잠금, 휴지통 비우기 등 프리셋을 제공합니다. 스크립트는 현재 사용자 권한으로 실행됩니다."
example = "osascript"

[home.shots]
heading = "조용하지만 갖출 건 다 갖춘 앱"
lead = "한 창에서 모두 설정하고, 그 뒤로는 메뉴 막대에 머뭅니다."

[[home.shots.items]]
caption = "제스처 라이브러리"
alt = "범위별로 묶인 StrokeMouse 제스처 목록"
desc = "전역 제스처와 앱별 제스처를 한 목록에서 검색, 필터, 일괄 작업으로 관리합니다."

[[home.shots.items]]
caption = "제스처 테스트"
alt = "StrokeMouse 제스처 테스트 창"
desc = "실행하기 전에 자유롭게 그려 보고 어떤 제스처와 일치하는지 확인합니다."

[[home.shots.items]]

[home]
slogan = "한 획이면, 바로."
keyword = "macOS용 마우스·트랙패드 제스처"
lead = "StrokeMouse는 마우스 궤적, 측면 버튼, 수정 키 그리기, 여러 손가락 트랙패드 제스처를 단축키, 윈도우 명령, 앱 실행, 스크립트로 바꿔 주는 무료 오픈소스 Mac 앱입니다. 모든 처리는 로컬에서 이루어집니다."
meta = ["무료", "오픈소스", "macOS 14+", "Apple Silicon & Intel"]
features = [
  "마우스 그리기: 오른쪽, 가운데 또는 측면 버튼을 누른 채 원하는 경로를 그리기",
  "마우스 버튼: 측면이나 가운데 버튼 클릭에 동작을 매핑, 수정 키 하나와 함께 쓰기도 가능",
  "마우스 조합: 오른쪽 버튼 + 스크롤, 오른쪽 + 왼쪽 클릭, 드래그 스크롤, 화면 가장자리 오른쪽 클릭·스크롤",
  "트랙패드 그리기: Fn, Control, Option, Shift, Command 중 하나를 누른 채 포인터 이동",
  "터치 제스처(실험적): 여러 손가락 탭, 클릭, 스와이프, 핀치, 회전 등 40종",
  "동작: 시스템 명령, 키보드 단축키, 앱·URL 열기, 미디어 키, 윈도우 동작, Shell과 AppleScript",
  "전역, 앱 그룹, 앱별 범위",
  "스크롤 향상: 마우스 휠과 트랙패드를 따로 반전, 일반 휠 부드러운 스크롤",
  "JSON 가져오기와 내보내기",
  "영어, 중국어 간체, 중국어 번체, 한국어, 일본어, 러시아어, 프랑스어 인터페이스",
]

[home.pad]
title = "직접 그려 보세요"
idle = "궤적을 기다리는 중"
drawing = "기록 중…"
matched = "일치"

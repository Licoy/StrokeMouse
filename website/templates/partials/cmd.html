<div class="cmd">
  <span class="cmd-prompt" aria-hidden="true">$</span>
  <code>{{ cmd }}</code>
  <button class="cmd-copy" type="button" data-copy="{{ cmd }}" aria-label="{{ t.ui.copy }}" data-copied-label="{{ t.ui.copied }}">
    <span class="cmd-copy-idle">{{ icon.copy() }}</span><span class="cmd-copy-done">{{ icon.check() }}</span>
  </button>
</div>
